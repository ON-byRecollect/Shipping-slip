<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="のべるん">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>のべるん</title>

  <link rel="icon" href="noverun-icon-v2.png">
  <link rel="apple-touch-icon" href="noverun-icon-v2.png">
  <link rel="manifest" href="manifest.webmanifest">


  <style>
    /* iOS システムカラー */
    :root {
      --bg: #f2f2f7; --panel: #ffffff; --ink: #000; --ink-strong: #000;
      --muted: rgba(60,60,67,0.6); --muted2: rgba(60,60,67,0.3); --line: rgba(60,60,67,0.18);
      --fill: rgba(118,118,128,0.12); --accent: #007aff; --accent-ink: #fff;
      --danger: #ff3b30; --ok: #34c759; --active: rgba(0,122,255,0.12);
      --bar: #f9f9f9; --side: #f2f2f7; --shadow: 0 10px 40px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000; --panel: #1c1c1e; --ink: #fff; --ink-strong: #fff;
        --muted: rgba(235,235,245,0.6); --muted2: rgba(235,235,245,0.3); --line: rgba(84,84,88,0.65);
        --fill: rgba(118,118,128,0.24); --accent: #0a84ff; --danger: #ff453a; --ok: #30d158;
        --active: rgba(10,132,255,0.22); --bar: #161618; --side: #000; --shadow: 0 10px 40px rgba(0,0,0,0.6);
      }
    }
    :root[data-theme="dark"] {
      --bg: #000; --panel: #1c1c1e; --ink: #fff; --ink-strong: #fff;
      --muted: rgba(235,235,245,0.6); --muted2: rgba(235,235,245,0.3); --line: rgba(84,84,88,0.65);
      --fill: rgba(118,118,128,0.24); --accent: #0a84ff; --danger: #ff453a; --ok: #30d158;
      --active: rgba(10,132,255,0.22); --bar: #161618; --side: #000; --shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    /* ページ自体はスクロールさせない（iOS で中途半端にずれて背景が見えるのを防ぐ） */
    body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--panel); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
      font-size: 17px; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
    }
    button, input, textarea { font-family: inherit; color: inherit; letter-spacing: inherit; }
    /* iOS は 16px 未満の入力欄にフォーカスすると自動で拡大するため、必ず 16px 以上にする */
    input, textarea { font-size: max(16px, 1em); }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: none; padding: 0; }
    button:active { opacity: 0.55; }
    [hidden] { display: none !important; }

    /* ---------- ログイン ---------- */
    .gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); z-index: 100; }
    .gate-box { width: 100%; max-width: 340px; text-align: center; }
    .gate-icon { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); margin-bottom: 18px; }
    .gate-box h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; color: var(--ink-strong); letter-spacing: 0.02em; }
    .gate-box p { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
    .gate-box input + input { margin-top: 10px; }
    .gate-box button:disabled { opacity: 0.5; }
    .gate-box input { width: 100%; padding: 14px 16px; border: none; border-radius: 12px; font-size: 17px; background: var(--panel); outline: none; text-align: center; }
    .gate-box button { width: 100%; margin-top: 12px; padding: 15px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px; }
    .gate-err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }

    /* 画面に固定した枠。回転してもブラウザの表示領域にそのまま追従する */
    /* 高さと位置は JS で「実際に見えている領域（キーボードを除く）」に合わせる */
    .app { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 100%; }
    /* 横向き時のノッチ／ダイナミックアイランドを避ける */
    .sidebar { padding-left: env(safe-area-inset-left); }
    .main { padding-right: env(safe-area-inset-right); }
    body.no-sidebar .main, body.focus .main { padding-left: env(safe-area-inset-left); }

    /* ---------- サイドバー（iPad のサイドバー風） ---------- */
    .sidebar { width: 310px; flex-shrink: 0; background: var(--side); border-right: 0.5px solid var(--line); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(.2,.8,.2,1); padding-top: env(safe-area-inset-top); }
    body.no-sidebar .sidebar { display: none; }
    .side-head { padding: 12px 16px 4px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .brand { font-weight: 700; font-size: 32px; color: var(--ink-strong); letter-spacing: 0.01em; }
    .add-btn { color: var(--accent); font-size: 17px; font-weight: 500; padding: 6px 4px; white-space: nowrap; }
    .tree { flex: 1; overflow-y: auto; padding: 6px 16px 20px; -webkit-overflow-scrolling: touch; }
    .work { margin-bottom: 18px; }
    .work-card { background: var(--panel); border-radius: 12px; overflow: hidden; }
    .work-row { display: flex; align-items: center; gap: 6px; padding: 11px 12px 11px 6px; cursor: pointer; min-height: 48px; }
    .ch-row { display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer; font-size: 16px; user-select: none; -webkit-user-select: none; position: relative; min-height: 44px; }
    .ch-row::before { content: ''; position: absolute; top: 0; left: 40px; right: 0; border-top: 0.5px solid var(--line); }
    .work-row:active, .ch-row:active { background: var(--fill); }
    .work-row.active, .ch-row.active { background: var(--accent); color: #fff; }
    .work-row.active .work-name, .work-row.active .mini, .ch-row.active .mini, .ch-row.active .ch-no, .work-row.active .twisty { color: rgba(255,255,255,0.9); }
    .ch-row.active::before, .ch-row.active + .ch-row::before { border-color: transparent; }
    .twisty { width: 28px; height: 28px; font-size: 13px; color: var(--accent); flex-shrink: 0; transition: transform 0.2s; }
    .work.open .twisty { transform: rotate(90deg); }
    .work-name { flex: 1; font-weight: 600; font-size: 17px; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .mini.done { color: var(--ok); }
    .chapters { list-style: none; margin: 0; padding: 0; }
    .work:not(.open) .chapters, .work:not(.open) .work-actions { display: none; }
    .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-no { color: var(--muted); font-size: 13px; width: 20px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .handle { display: none; color: var(--muted); padding: 2px 6px; font-size: 16px; }
    .handle { cursor: grab; touch-action: none; font-size: 18px; }
    .tree.editing .handle, .detail.editing .handle { display: inline-block; }
    .tree.editing .ch-row, .tree.editing .work-row { cursor: default; }
    .tree.editing .ch-row.active, .tree.editing .work-row.active { background: transparent; color: inherit; }
    .tree.editing .work-row.active .work-name { color: var(--ink-strong); }
    .tree.editing .ch-row.active .ch-no { color: var(--muted); }
    .tree.editing .ch-row::before { border-color: var(--line) !important; }
    .tree.editing .mini, .tree.editing .twisty { display: none; }
    .tree.editing .work-row { padding: 8px 12px; min-height: 0; }
    .tree.editing .ch-row { padding: 6px 12px; min-height: 0; }
    .work.dragging { box-shadow: var(--shadow); border-radius: 12px; position: relative; z-index: 5; transform: scale(1.02); }
    .placeholder { color: var(--muted) !important; font-weight: 400 !important; }
    .side-tools { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px 20px; }
    .side-note { flex: 1; font-size: 13px; color: var(--muted); }
    .section-label.with-btn { display: flex; justify-content: space-between; align-items: center; }
    .section-label .text-btn { font-size: 13px; padding: 0; }
    .section-note.warn { color: var(--danger); }
    .section-note.warn:empty { display: none; }
    .group-btn:disabled { color: var(--muted2); cursor: default; }
    .tree-rename { flex: 1; min-width: 0; height: 34px; align-self: center; border: none; border-radius: 8px; background: var(--fill); padding: 0 9px; font-size: 16px; line-height: 34px; outline: none; color: var(--ink-strong); }
    .tree-rename.rn-work { font-weight: 600; font-size: 17px; }
    .tree-rename:focus { box-shadow: 0 0 0 2px var(--accent); }
    .ch-rename { width: calc(100% - 34px); border: none; border-radius: 7px; background: var(--fill); padding: 5px 8px; font-size: 16px; outline: none; vertical-align: middle; }
    .modal-btns button:disabled { cursor: default; }
    .del-btn { width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 16px; line-height: 22px; margin-right: 10px; vertical-align: middle; font-weight: 700; }
    .row-tools { display: inline-flex; gap: 2px; align-items: center; }
    .detail tr.dragging td { background: var(--panel); }
    tr.dragging { box-shadow: var(--shadow); position: relative; z-index: 5; }
    .body-input:disabled { background: transparent; opacity: 1; -webkit-text-fill-color: var(--muted2); }
    .ch-row.dragging { box-shadow: var(--shadow); z-index: 5; background: var(--panel); border-radius: 10px; transform: scale(1.02); }
    .work-actions { display: flex; justify-content: space-between; padding: 8px 6px 0; }
    .chip { color: var(--accent); font-size: 15px; padding: 4px 6px; }
    .chip.on { font-weight: 600; }
    .empty-tree { color: var(--muted); font-size: 15px; text-align: center; padding: 40px 10px; line-height: 1.8; }
    .account { border-top: 0.5px solid var(--line); padding: 10px 16px 0 20px; display: flex; align-items: center; gap: 8px; }
    .account-info { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .account-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #accountEmail { color: var(--ink); font-size: 13px; }
    .account + .side-foot { border-top: none; }
    .side-foot { border-top: 0.5px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 14px; }

    /* ---------- メイン ---------- */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
      background: var(--bar);
      border-bottom: 0.5px solid var(--line); min-height: 50px; position: relative; z-index: 2;
    }
    .crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 17px; overflow: hidden; }
    .crumb a { color: var(--accent); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; flex-shrink: 1; }
    .crumb a:active { opacity: 0.5; }
    .crumb b { font-weight: 600; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .counts { display: flex; gap: 6px; flex-shrink: 0; }
    .count { display: flex; flex-direction: column; align-items: flex-end; padding: 4px 10px 5px; border-radius: 0; background: transparent; line-height: 1.2; min-width: 88px; }
    #chCount:not([hidden]) + .count { border-left: 0.5px solid var(--line); } /* 背景なしでも2つを区切る */
    .count small { font-size: 10px; color: var(--muted); font-weight: 600; }
    .count span { font-size: 14px; font-weight: 600; color: var(--ink-strong); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .count.done span { color: var(--ok); }
    .count .bar { width: 100%; height: 3px; background: var(--fill); border-radius: 9px; margin-top: 3px; overflow: hidden; }
    .count .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9px; transition: width 0.25s; }
    .count.done .bar i { background: var(--ok); }
    .icon-btn { color: var(--accent); font-size: 22px; width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-btn svg { width: 22px; height: 22px; }

    .toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; background: var(--bar); border-bottom: 0.5px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }
    .tool { flex-shrink: 0; color: var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 15px; white-space: nowrap; }
    .tool.on { background: var(--active); font-weight: 600; }
    .tool.ins { min-width: 44px; font-size: 16px; }
    .sep { width: 0.5px; height: 20px; background: var(--line); flex-shrink: 0; margin: 0 4px; }
    .save-state { flex-shrink: 0; margin-left: auto; padding: 0 6px 0 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }

    .view { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }

    /* エディタ（メモアプリ風） */
    .editor { max-width: 720px; margin: 0 auto; padding: 24px 24px 120px; display: flex; flex-direction: column; min-height: 100%; }
    .ch-head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 0.5px solid var(--line); }
    .ch-title { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 28px; font-weight: 700; color: var(--ink-strong); padding: 0; letter-spacing: 0.01em; }
    .goal-field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-shrink: 0; }
    .goal-field input { width: 92px; padding: 6px 10px; border: none; border-radius: 8px; background: var(--fill); font-size: 16px; text-align: right; outline: none; font-variant-numeric: tabular-nums; }
    .body-input, .preview { flex: 1; font-size: var(--fs, 17px); line-height: 1.95; letter-spacing: 0.03em; color: var(--ink); }
    .body-input { min-height: 60vh; width: 100%; border: none; outline: none; background: transparent; resize: none; padding: 0; caret-color: var(--accent); }
    .ch-title::placeholder, .body-input::placeholder { color: var(--muted2); }
    .preview p { margin: 0; min-height: 1em; }
    .preview rt { font-size: 0.5em; color: var(--muted); }
    .ch-foot { margin-top: 40px; display: flex; justify-content: center; }
    .danger-link { color: var(--danger); font-size: 15px; padding: 8px; }

    /* 縦書き */
    body.vertical .editor { max-width: none; margin: 0; height: 100%; min-height: 0; padding: 24px; flex-direction: row-reverse; }
    body.vertical .ch-head { writing-mode: vertical-rl; flex-direction: row; align-items: flex-start; border-bottom: none; border-left: 0.5px solid var(--line); padding: 0 0 0 12px; margin: 0 0 0 18px; }
    body.vertical .ch-title { width: auto; height: 100%; }
    body.vertical .goal-field input { writing-mode: horizontal-tb; }
    body.vertical .body-input, body.vertical .preview { writing-mode: vertical-rl; text-orientation: mixed; min-height: 0; height: 100%; min-width: 0; overflow-x: auto; }
    body.vertical .ch-foot { display: none; }

    /* 作品詳細（設定アプリ風のグループ表示） */
    .view.grouped { background: var(--bg); }
    .detail { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    .cover-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
    .cover { position: relative; width: 150px; aspect-ratio: 1 / 1.414; border-radius: 8px; overflow: hidden; background: var(--panel); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.14); }
    .cover:not(.has-img) { box-shadow: none; border: 1.5px dashed var(--muted2); }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover-actions { display: flex; gap: 18px; margin-top: 12px; justify-content: center; }
    .text-btn { color: var(--accent); font-size: 15px; padding: 4px; }
    .text-btn.danger { color: var(--danger); }
    .section-label { font-size: 13px; color: var(--muted); margin: 24px 16px 7px; }
    .section-note { font-size: 13px; color: var(--muted); margin: 7px 16px 0; line-height: 1.5; }
    .section-note.center { text-align: center; margin-top: 18px; }
    .group { background: var(--panel); border-radius: 12px; overflow: hidden; }
    .group + .group { margin-top: 24px; }
    .work-title-input { width: 100%; border: none; background: transparent; font-size: 17px; color: var(--ink-strong); padding: 13px 16px; outline: none; }
    .synopsis { display: block; width: 100%; min-height: 160px; border: none; background: transparent; padding: 12px 16px; font-size: 17px; line-height: 1.7; outline: none; resize: vertical; }
    .work-title-input::placeholder, .synopsis::placeholder { color: var(--muted2); }
    .group-btn { display: block; width: 100%; padding: 13px 16px; font-size: 17px; color: var(--accent); text-align: left; }
    .group-btn.danger { color: var(--danger); text-align: center; }
    table.goals { width: 100%; border-collapse: collapse; font-size: 16px; }
    table.goals td, table.goals th { padding: 10px 16px 10px 0; text-align: right; font-variant-numeric: tabular-nums; position: relative; }
    table.goals td:first-child, table.goals th:first-child { text-align: left; padding-left: 16px; max-width: 0; width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.goals tbody tr td, table.goals tfoot td { border-top: 0.5px solid var(--line); }
    table.goals th { font-size: 12px; color: var(--muted); font-weight: 400; padding-top: 10px; padding-bottom: 6px; }
    table.goals tfoot td { font-weight: 600; color: var(--ink-strong); }
    table.goals td.num { color: var(--muted); }
    table.goals tr.link { cursor: pointer; }
    table.goals tr.link:active td { background: var(--fill); }
    table.goals input { width: 88px; padding: 5px 8px; border: none; border-radius: 7px; background: var(--fill); text-align: right; font-size: 16px; outline: none; }

    .empty-view { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--muted); padding: 24px; text-align: center; font-size: 15px; background: var(--bg); }
    .btn-primary { background: var(--accent); color: #fff; border-radius: 12px; padding: 13px 22px; font-weight: 600; font-size: 17px; }

    /* 集中モード */
    /* 集中モード：メニュー・サブタイトル・文字数カウントを隠して本文だけにする */
    body.focus .sidebar, body.focus .topbar, body.focus .ch-head { display: none !important; }
    body.focus .toolbar { padding-top: calc(4px + env(safe-area-inset-top)); }
    body.focus .editor { padding-top: 28px; }

    /* アラート（iOS 風） */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; animation: fade 0.15s; }
    .modal { width: 290px; background: var(--panel); box-shadow: var(--shadow); border-radius: 14px; overflow: hidden; text-align: center; animation: pop 0.2s cubic-bezier(.2,.9,.3,1.2); }
    .modal-body { padding: 20px 16px 16px; }
    .modal h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; color: var(--ink-strong); }
    .modal .sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 2px 4px; text-align: left; }
    .modal input { width: 100%; padding: 8px 10px; border: 0.5px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 16px; outline: none; }
    .ruby-preview { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 22px; min-height: 52px; }
    .ruby-preview rt { font-size: 0.5em; color: var(--muted); }
    .modal-btns { display: flex; border-top: 0.5px solid var(--line); }
    .modal-btns button { flex: 1; padding: 12px; font-size: 17px; color: var(--accent); }
    .modal-btns button + button { border-left: 0.5px solid var(--line); font-weight: 600; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: scale(1.15); } }

    .toast { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: var(--bar); color: var(--ink-strong); padding: 11px 20px; border-radius: 99px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: 0.25s; z-index: 80; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,0.15); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .scrim { display: none; }
    .menu-btn { display: none; }

    @media (max-width: 760px) {

    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ===== クラウド（Supabase：認証と保存） =====

    const Cloud = {
      session: ls.get(SESSION_KEY, null),

      setSession(j) {

      refresh() {

        if (!this.refreshing) {
          this.refreshing = (async () => {
            // 別タブが先に更新していればそれを使う
            const latest = ls.get(SESSION_KEY, null);
            if (latest && latest.refresh_token !== this.session.refresh_token && latest.expires_at - 60 > Date.now() / 1000) { this.session = latest; return; }
            const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
              method: 'POST', headers: this.headers(), body: JSON.stringify({ refresh_token: this.session.refresh_token })
            });
            if (r.status >= 400 && r.status < 500) throw authError();
            if (!r.ok) throw new Error('network');
            this.setSession(await r.json());
          })().finally(() => { this.refreshing = null; });
        }
        return this.refreshing;
      },
      async token() {
        if (!this.session) throw authError();
        if (this.session.expires_at - 60 < Date.now() / 1000) await this.refresh();
        return this.session.access_token;
      },
      async rest(path, opts = {}, retry = true) {
        const t = await this.token();
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers: this.headers({ Authorization: 'Bearer ' + t, ...(opts.headers || {}) }) });
        if (r.status === 401 && retry) { await this.refresh(); return this.rest(path, opts, false); }

          const j = await r.json().catch(() => ({}));

        }
        const text = await r.text();

      },
      signOut() {
        const s = this.session;

        ls.del(SESSION_KEY);
        if (s) fetch(`${SUPABASE_URL}/auth/v1/logout`, { method: 'POST', headers: this.headers({ Authorization: 'Bearer ' + s.access_token }) }).catch(() => {});
      }
    };

    // ===== ログイン（端末ごとに一度だけ。以降はセッションを自動更新） =====
    let started = false;
    function showLogin(reauth) {
      $('gate').hidden = false;
      $('gateMsg').textContent = reauth ? 'ログインの有効期限が切れました。もう一度ログインしてください' : '一度ログインした端末では、次回から入力は不要です';
      if (Cloud.session && Cloud.session.email) $('gateEmail').value = Cloud.session.email;

    }
    $('gateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('gateForm').querySelector('button');
      btn.disabled = true; $('gateErr').textContent = '';
      try {
        await Cloud.signIn($('gateEmail').value.trim(), $('gatePass').value);
        $('gatePass').value = '';
        // 別のアカウントでログインした場合は、この端末に残っている前の人のデータを消す
        const owner = ls.get(OWNER_KEY, null);
        if (owner && owner !== Cloud.session.user_id) await clearLocalData();
        ls.set(OWNER_KEY, Cloud.session.user_id);
        $('gate').hidden = true;
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        if (!started) start(); else { renderAccount(); sync(); }
      } catch (err) {
        $('gateErr').textContent =
          err.code === 'invalid_credentials' || err.status === 400 ? 'メールアドレスかパスワードが違います'
          : err.code === 'email_not_confirmed' ? 'メールアドレスの確認が済んでいません'
          : err instanceof TypeError ? 'サーバーに接続できません。通信状態を確認してください'
          : 'ログインできませんでした（' + err.message + '）';
      } finally { btn.disabled = false; }
    });

    // ===== 保存先（IndexedDB、使えなければ localStorage） =====
    const DB = {
      db: null,
      open() {
        return new Promise((res) => {
          try {
            const r = indexedDB.open('novel-writer', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('works', { keyPath: 'id' });
            r.onsuccess = () => { this.db = r.result; res(true); };
            r.onerror = () => res(false);
            r.onblocked = () => res(false);
          } catch { res(false); }
        });
      },
      req(mode, fn) {
        return new Promise((res, rej) => {
          const tx = this.db.transaction('works', mode);
          const out = fn(tx.objectStore('works'));

          tx.onerror = () => rej(tx.error);
          tx.onabort = () => rej(tx.error);
        });
      },

      async put(w) { if (this.db) return this.req('readwrite', (s) => s.put(w)); if (!ls.set('novel:works', state.works)) throw new Error('quota'); },
      async del(id) { if (this.db) return this.req('readwrite', (s) => s.delete(id)); ls.set('novel:works', state.works); },
      async clear() { if (this.db) return this.req('readwrite', (s) => s.clear()); ls.del('novel:works'); }
    };

    // ===== 状態 =====
    const state = {
      works: [],
      prefs: Object.assign({
        view: null,            // { type: 'chapter'|'detail', workId, chapterId }
        open: {},              // 展開中の作品
        fontSize: 17, vertical: false, serif: false, theme: null, sidebar: true, preview: false
      }, ls.get(PREF_KEY, {})),
      editing: false           // メニューの編集（並び替え）モード
    };
    const savePrefs = () => ls.set(PREF_KEY, state.prefs);
    const getWork = (id) => state.works.find((w) => w.id === id);
    const getChapter = (w, id) => w && w.chapters.find((c) => c.id === id);
    function current() {
      const v = state.prefs.view;
      if (!v) return {};
      const work = getWork(v.workId);
      if (!work) return {};
      return { work, chapter: v.type === 'chapter' ? getChapter(work, v.chapterId) : null, type: v.type };
    }

    // ===== 文字数（ルビ記法・空白・改行を除く） =====
    const segmenter = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('ja', { granularity: 'grapheme' }) : null;
    const graphemes = (s) => segmenter ? [...segmenter.segment(s)].length : [...s].length;
    const KANJI = '々〆ヵヶ〇\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF';
    const RE_RUBY_EXPLICIT = /[|｜]([^|｜《》\n]{1,50}?)《([^《》\n]{1,50})》/g;
    const RE_RUBY_IMPLICIT = new RegExp('([' + KANJI + ']+)《([^《》\\n]{1,50})》', 'g');
    function stripRuby(s) {
      return s.replace(RE_RUBY_EXPLICIT, '$1').replace(RE_RUBY_IMPLICIT, '$1');
    }
    const countText = (s) => graphemes(stripRuby(s || '').replace(/\s/g, ''));
    function renderRubyHTML(s) {
      // HTML エスケープ後もルビ記号はそのまま残るので、その上で変換
      return esc(s)
        .replace(RE_RUBY_EXPLICIT, '<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>')
        .replace(RE_RUBY_IMPLICIT, '<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>');

    const workTotals = (w) => w.chapters.reduce((a, c) => ({ count: a.count + chCount(c), goal: a.goal + (Number(c.goal) || 0) }), { count: 0, goal: 0 });
    const ratio = (n, g) => `${fmt(n)}/${fmt(g)}`;

    // ===== 自動保存（入力が止まってから一定時間後）→ 端末に保存 → クラウドへ同期 =====
    const dirty = new Set();                         // 端末にまだ保存していない作品

    const blocked = new Set(); // タイトル未入力のため保存を保留している作品

        for (const id of ids) {

    }
    function serialize(w) {
      const { _savedTitle, ...rest } = w;
      return { ...rest, chapters: w.chapters.map(({ _count, _savedTitle, ...c }) => c) };
    }
    function remoteData(w) {
      const { _remoteVer, ...rest } = serialize(w);
      return rest;
    }
    const setSaveState = (t) => { $('saveState').textContent = t; const s = $('syncState'); if (s) s.textContent = t; };
    function showCloudState(st) {
      if (st) cloudState = st;
      if (dirty.size) return setSaveState('未保存…');
      const cw = current().work;
      if (cw && blocked.has(cw.id)) return setSaveState(hasTitle(cw) ? '未保存（サブタイトルを入力してください）' : '未保存（作品名を入力してください）');
      const wait = pending.size || Object.keys(tombs).length;
      setSaveState(
        cloudState === 'syncing' ? '同期中…'
        : cloudState === 'offline' ? (wait ? 'オフライン・端末に保存済み' : 'オフライン')
        : cloudState === 'notable' ? '⚠ クラウド未設定・端末に保存済み'
        : cloudState === 'auth' ? '⚠ 要ログイン・端末に保存済み'
        : wait ? '端末に保存済み'
        : lastSynced ? `☁ 同期済み ${hhmm(lastSynced)}` : '☁ 同期済み');
    }

    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else sync(); });
    window.addEventListener('focus', () => sync());

    window.addEventListener('beforeunload', (e) => {
      if (dirty.size) { flush(); e.preventDefault(); e.returnValue = ''; }
    });
    setInterval(() => { if (!document.hidden && !dirty.size) sync(); }, SYNC_INTERVAL);

    let syncing = false, syncAgain = null;
    async function sync(opts = {}) {
      if (!started || !Cloud.session || cloudState === 'notable') return;
      if (syncing) { syncAgain = { pull: (syncAgain && syncAgain.pull) || opts.pull !== false }; return; }
      syncing = true;
      showCloudState('syncing');
      try {
        if (opts.pull !== false) await pull();
        for (const id of Object.keys(tombs)) {
          await pushDelete(id, tombs[id]);
          delete tombs[id]; saveTombs();
          pending.delete(id); savePending();
        }
        for (const id of [...pending]) {
          if (dirty.has(id)) continue;
          const w = getWork(id);
          if (!w) { pending.delete(id); savePending(); continue; }
          if (!isSavable(w)) continue; // タイトル未入力の間は送らない
          const g = gen[id];
          await pushWork(w);
          if (gen[id] === g) { pending.delete(id); savePending(); }
        }
        lastSynced = new Date();
        showCloudState('ok');
      } catch (e) {
        if (e.auth) { showCloudState('auth'); showLogin(true); }
        else if (e.code === 'PGRST205' || e.code === '42P01' || e.status === 404) { showCloudState('notable'); toast('クラウドの保存先（テーブル）がまだ作成されていません', 4000); }
        else { console.warn('sync failed', e); showCloudState('offline'); }
      } finally {
        syncing = false;
        if (syncAgain) { const o = syncAgain; syncAgain = null; setTimeout(() => sync(o), 200); }
      }
    }

    // クラウド → 端末
    async function pull() {
      const list = await Cloud.rest(`${TABLE}?select=id,updated_at,deleted`);
      const seen = new Set();
      const need = [];
      for (const r of list) {
        seen.add(r.id);
        if (r.id in tombs) continue;
        const local = getWork(r.id);
        const busy = dirty.has(r.id) || pending.has(r.id);
        if (r.deleted) {
          if (local && !busy) await removeLocal(local);   // 他の端末で削除された
          continue;                                         // 編集中なら送信時に復活させる
        }
        if (!local) need.push(r.id);
        else if (r.updated_at !== local._remoteVer && !busy) need.push(r.id);
        // busy の場合は送信時にバージョン不一致を検出して競合処理する
      }
      for (let i = 0; i < need.length; i += 20) {
        const rows = await Cloud.rest(`${TABLE}?select=id,data,updated_at&id=in.(${need.slice(i, i + 20).join(',')})`);
        for (const row of rows) await applyRemote(row);
      }
      // まだクラウドにない作品は送る
      for (const w of state.works) {
        if (w._remoteVer != null && !seen.has(w.id)) w._remoteVer = null;
        if (w._remoteVer == null && !pending.has(w.id) && w._savedTitle && isSavable(w)) markPending(w.id);
      }
      savePending();
      if (need.length) refreshAfterRemote();
    }
    function toWork(row) {
      const d = row.data || {};
      return { title: '', synopsis: '', cover: '', created: Date.now(), ...d, chapters: Array.isArray(d.chapters) ? d.chapters : [], id: row.id, updated: d.updated || row.updated_at, _remoteVer: row.updated_at };
    }
    async function applyRemote(row) {
      const w = toWork(row);
      markSaved(w);
      const i = state.works.findIndex((x) => x.id === w.id);
      if (i >= 0) state.works[i] = w; else state.works.push(w);
      await DB.put(serialize(w));
    }
    async function removeLocal(w) {
      state.works = state.works.filter((x) => x.id !== w.id);
      await DB.del(w.id).catch(() => {});
      refreshAfterRemote();
    }
    function refreshAfterRemote() {
      // 本文を編集中ならカーソル位置を保つ
      const editing = document.activeElement === bodyEl ? [bodyEl.selectionStart, bodyEl.selectionEnd, $('view').scrollTop] : null;
      if (!current().work) { const f = sortedWorks()[0]; state.prefs.view = f ? { type: 'detail', workId: f.id } : null; }
      if (state.prefs.view && state.prefs.view.type === 'chapter' && !current().chapter) state.prefs.view = { type: 'detail', workId: state.prefs.view.workId };
      render(true);
      if (editing && bodyEl && document.body.contains(bodyEl)) {
        bodyEl.focus(); bodyEl.setSelectionRange(editing[0], editing[1]); $('view').scrollTop = editing[2];
      }
    }

    // 端末 → クラウド（バージョンが一致するときだけ上書き＝他端末の変更を消さない）
    async function pushWork(w) {
      const ver = Math.max(Date.now(), (w._remoteVer || 0) + 1);
      const body = { data: remoteData(w), updated_at: ver, deleted: false };
      if (w._remoteVer == null) {
        try {
          await Cloud.rest(TABLE, { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ id: w.id, ...body }) });
        } catch (e) {
          if (e.status === 409) return resolveConflict(w);
          throw e;
        }
      } else {
        const rows = await Cloud.rest(`${TABLE}?id=eq.${w.id}&updated_at=eq.${w._remoteVer}&select=id`, {
          method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(body)
        });
        if (!rows || !rows.length) return resolveConflict(w);
      }
      w._remoteVer = ver;
      await DB.put(serialize(w));
    }
    async function pushDelete(id, ver) {
      if (ver == null) return; // クラウドに送る前に削除したもの
      await Cloud.rest(`${TABLE}?id=eq.${id}&updated_at=eq.${ver}`, {
        method: 'PATCH', headers: { Prefer: 'return=minimal' },
        body: JSON.stringify({ data: {}, deleted: true, updated_at: Math.max(Date.now(), ver + 1) })
      });
      // 他の端末で先に編集されていた場合は削除されず、次の同期で戻ってくる
    }
    // 同じ作品を別の端末でも変更していた場合：クラウドの版を採用し、この端末の版はコピーとして残す
    async function resolveConflict(w) {
      const rows = await Cloud.rest(`${TABLE}?select=id,data,updated_at,deleted&id=eq.${w.id}`);
      const remote = rows && rows[0];
      if (!remote) { w._remoteVer = null; return pushWork(w); }
      if (remote.deleted) { w._remoteVer = remote.updated_at; return pushWork(w); } // 他端末で削除→この端末の版で復活
      const copy = { ...serialize(w), id: uid(), title: (w.title || '無題の作品') + '（この端末の版）', created: Date.now(), _remoteVer: null };
      markSaved(copy);
      state.works.push(copy);
      await DB.put(serialize(copy));
      await applyRemote(remote);
      await pushWork(copy);
      refreshAfterRemote();
      toast('別の端末での変更と重なったため、この端末の版を「（この端末の版）」として残しました', 5000);
    }

    // ===== データ操作 =====
    const hasTitle = (x) => !!(x && (x.title || '').trim());
    // 作品名と全サブタイトルが入力されている作品だけ保存する
    const isSavable = (w) => hasTitle(w) && w.chapters.every(hasTitle);
    function markSaved(w) {
      w._savedTitle = w.title;
      w.chapters.forEach((c) => { c._savedTitle = c.title; });
    }
    function newChapter(w) {
      const c = { id: uid(), title: '', body: '', goal: 0, created: Date.now(), updated: Date.now(), _count: 0 };
      w.chapters.push(c);
      return c;
    }
    function createWork() {
      const w = { id: uid(), title: '', synopsis: '', cover: '', chapters: [], created: Date.now(), updated: Date.now() };
      state.works.push(w);
      state.prefs.open[w.id] = true;
      return w; // 作品名が入力されるまで保存しない
    }
    // 入力途中で離れた場合：未保存の空タイトルは元に戻すか破棄する
    function cleanupDrafts(keep) {
      for (const w of [...state.works]) {
        const keepWork = keep && keep.workId === w.id;
        let changed = false;
        if (!hasTitle(w) && !(keepWork && keep.type === 'detail')) {
          if (w._savedTitle) { w.title = w._savedTitle; changed = true; }
          else { state.works = state.works.filter((x) => x !== w); dirty.delete(w.id); blocked.delete(w.id); continue; }
        }
        const n = w.chapters.length;
        w.chapters = w.chapters.filter((c) => {
          if (hasTitle(c) || (keepWork && keep.chapterId === c.id)) return true;
          if (c._savedTitle) { c.title = c._savedTitle; changed = true; return true; }
          return false;
        });
        if (w.chapters.length !== n) changed = true;
        if (changed && blocked.has(w.id)) { blocked.delete(w.id); dirty.add(w.id); }
      }
    }
    function navigate(view) {
      if (!view || !state.prefs.view || view.workId !== state.prefs.view.workId || view.type !== 'detail') detailEditing = false;
      cleanupDrafts(view);
      flush();
      state.prefs.view = view;
      if (view && view.workId) state.prefs.open[view.workId] = true;
      savePrefs();
      document.body.classList.remove('drawer');
      render();
    }
    function addChapter(w) {
      if (!hasTitle(w)) { toast('先に作品名を入力してください'); return; }
      openPrompt({ title: 'サブタイトルを追加', message: 'サブタイトルを入力してください', placeholder: '例：第一章 旅立ち', ok: '追加' }, (name) => {
        state.editing = false;
        const c = newChapter(w);
        c.title = name;
        touch(w);
        navigate({ type: 'chapter', workId: w.id, chapterId: c.id });
        setTimeout(() => { bodyEl && bodyEl.focus(); }, 0);
      });
    }
    // 1行入力のダイアログ（iOS のアラート風）。空欄では確定できない
    function openPrompt(opt, done) {
      const input = h('input', { type: 'text', value: opt.value || '', placeholder: opt.placeholder || '', maxlength: '100' });
      const okBtn = h('button', {}, opt.ok || 'OK');
      const close = () => bg.remove();
      const ok = () => { const v = input.value.trim(); if (!v) { input.focus(); return; } close(); done(v); };
      const sync = () => { okBtn.disabled = !input.value.trim(); okBtn.style.opacity = okBtn.disabled ? 0.35 : 1; };
      okBtn.addEventListener('click', ok);
      input.addEventListener('input', sync);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ok(); } else if (e.key === 'Escape') close(); });
      const bg = h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === bg) close(); } },
        h('div', { class: 'modal', role: 'dialog', 'aria-label': opt.title },
          h('div', { class: 'modal-body' },
            h('h3', {}, opt.title),
            opt.message ? h('p', { class: 'sub' }, opt.message) : null,
            input),
          h('div', { class: 'modal-btns' }, h('button', { onclick: close }, 'キャンセル'), okBtn)));
      document.body.append(bg);
      sync();
      input.focus();
    }

    // ===== 作品の並び順 =====
    function sortedWorks() {
      // 最終編集が新しい作品ほど上に表示する
      return state.works.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));
    }
    function applyChapterOrder(w, ids) {
      const before = w.chapters.map((c) => c.id).join();
      w.chapters.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      if (before !== w.chapters.map((c) => c.id).join()) touch(w);
      renderTree(); renderMainLight();
    }

    // ===== メニュー（階層） =====
    function renderTree() {
      const tree = $('tree');
      tree.innerHTML = '';
      tree.classList.toggle('editing', !!state.editing);
      $('editBtn').textContent = state.editing ? '完了' : '編集';
      $('editBtn').classList.toggle('on', !!state.editing);
      const cur = current();
      const list = sortedWorks();
      if (!list.length) {
        tree.append(h('div', { class: 'empty-tree' }, '作品がありません。', h('br'), '「＋ 新規作品」から始めましょう。'));
        return;
      }
      list.forEach((w, wi) => {
        const open = state.prefs.open[w.id] !== false; // 初期状態は展開
        const t = workTotals(w);
        const workEl = h('div', { class: 'work' + (open ? ' open' : ''), 'data-id': w.id });
        const card = h('div', { class: 'work-card' });
        workEl.append(card);
        card.append(h('div', {
          class: 'work-row' + (cur.work === w && cur.type === 'detail' ? ' active' : ''),
          onclick: () => { if (!state.editing) navigate({ type: 'detail', workId: w.id }); }
        },
          h('button', { class: 'twisty', 'aria-label': '開閉', onclick: (e) => { e.stopPropagation(); state.prefs.open[w.id] = !open; savePrefs(); renderTree(); } }, '▶'),
          state.editing ? renameInput(w, w, '作品名（必須）', 'work') : h('span', { class: 'work-name' + (hasTitle(w) ? '' : ' placeholder'), title: w.title }, hasTitle(w) ? w.title : '（作品名を入力）'),
          h('span', { class: 'mini' }, ratio(t.count, t.goal))
        ));
        if (t.goal && t.count >= t.goal) card.querySelector('.work-row .mini').classList.add('done');
        const ul = h('ul', { class: 'chapters' });
        w.chapters.forEach((c, i) => {
          const done = c.goal && chCount(c) >= c.goal;
          const li = h('li', {
            class: 'ch-row' + (cur.chapter === c ? ' active' : ''),
            'data-id': c.id,
            onclick: () => { if (!state.editing) navigate({ type: 'chapter', workId: w.id, chapterId: c.id }); }
          },
            h('span', { class: 'ch-no' }, i + 1),
            state.editing ? renameInput(w, c, 'サブタイトル（必須）', 'chapter') : h('span', { class: 'ch-name' + (hasTitle(c) ? '' : ' placeholder') }, hasTitle(c) ? c.title : '（サブタイトルを入力）'),
            h('span', { class: 'mini' + (done ? ' done' : '') }, ratio(chCount(c), c.goal || 0)),
            h('button', { class: 'handle', 'aria-label': 'ドラッグで並び替え', onpointerdown: (e) => startDrag(e, li, ul, (ids) => applyChapterOrder(w, ids)) }, '≡')
          );
          ul.append(li);
        });
        card.append(ul);
        workEl.append(h('div', { class: 'work-actions' },
          hasTitle(w) ? h('button', { class: 'chip', onclick: () => addChapter(w) }, '＋ サブタイトル') : null));
        tree.append(workEl);
      });
    }
    // メニューの編集中に作品名・サブタイトル名をその場で変更する（空欄にはできない）
    function renameInput(work, target, placeholder, kind) {
      return h('input', {
        class: 'tree-rename rn-' + kind, type: 'text', value: target.title, placeholder, maxlength: '100',
        onclick: (e) => e.stopPropagation(),
        onpointerdown: (e) => e.stopPropagation(),
        oninput: (e) => {
          if (!e.target.value.trim()) return;
          target.title = e.target.value;
          touch(work);
          renderCrumb();
        },
        onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.target.blur(); } },
        onchange: (e) => {
          if (!e.target.value.trim()) e.target.value = target.title; // 空にしたら元に戻す
          if (current().type === 'detail') renderView(true);
        },
        onblur: (e) => { if (!e.target.value.trim()) e.target.value = target.title; }
      });
    }
    // ドラッグで並び替え（メニュー・作品詳細で共通）
    function startDrag(e, item, container, onDrop) {
      e.preventDefault(); e.stopPropagation();
      const pid = e.pointerId;
      item.classList.add('dragging');
      const onMove = (ev) => {
        if (ev.pointerId !== pid) return;
        ev.preventDefault();
        const y = ev.clientY;
        const others = [...container.children].filter((x) => x !== item && x.dataset.id);
        let before = null;
        for (const o of others) {
          const r = o.getBoundingClientRect();
          if (y < r.top + r.height / 2) { before = o; break; }
        }
        if (before) { if (item.nextSibling !== before) container.insertBefore(item, before); }
        else if (others.length && others[others.length - 1].nextSibling !== item) others[others.length - 1].after(item);
      };
      const onUp = (ev) => {
        if (ev.pointerId !== pid) return;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        item.classList.remove('dragging');
        onDrop([...container.children].map((x) => x.dataset.id).filter(Boolean));
      };
      // 行をDOM上で動かすとポインタキャプチャが外れるため window で受け取る
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }

    // ===== 文字数表示（常時） =====
    function setCount(el, n, g, label) {
      el.querySelector('small').textContent = label;
      el.querySelector('span').textContent = ratio(n, g);
      el.querySelector('.bar i').style.width = (g ? Math.min(100, n / g * 100) : 0) + '%';
      el.classList.toggle('done', !!g && n >= g);
    }
    function renderCounts() {
      const { work, chapter } = current();
      $('counts').hidden = !work;
      if (!work) return;
      $('chCount').hidden = !chapter;
      if (chapter) setCount($('chCount'), chCount(chapter), Number(chapter.goal) || 0, 'この話');
      const t = workTotals(work);
      setCount($('wkCount'), t.count, t.goal, '作品');
    }
    function renderCrumb() {
      const { work, chapter } = current();
      const c = $('crumb');
      c.innerHTML = '';
      if (!work) { c.append(h('b', {}, 'のべるん')); return; }
      if (chapter) {
        c.append(h('a', { onclick: () => navigate({ type: 'detail', workId: work.id }) }, '‹ ' + (work.title || '作品')), h('b', {}, hasTitle(chapter) ? chapter.title : '新しいサブタイトル'));
      } else {
        c.append(h('b', {}, hasTitle(work) || work._savedTitle ? '作品詳細' : '新しい作品'));
      }
    }
    // 並び替えなどで番号だけ変わったときの軽い更新
    function renderMainLight() { renderCrumb(); renderCounts(); if (current().type === 'detail') renderView(true); }

    // ===== メイン表示 =====
    function render(keepScroll) {
      applyPrefs();
      renderTree();
      renderCrumb();
      renderCounts();
      renderView(keepScroll);
    }
    // keepScroll: 同じ画面の描き直しではスクロール位置を保つ
    function renderView(keepScroll) {
      const view = $('view');
      const top = keepScroll ? view.scrollTop : 0;
      view.innerHTML = '';
      view.classList.remove('grouped');
      view.scrollTop = 0;
      requestAnimationFrame(() => { if (keepScroll) view.scrollTop = top; });
      const cur = current();
      $('toolbar').hidden = cur.type !== 'chapter';
      document.body.classList.toggle('view-detail', !!cur.work && cur.type !== 'chapter');
      document.body.classList.toggle('view-chapter', !!cur.work && cur.type === 'chapter' && !!cur.chapter);
      document.body.classList.toggle('has-counts', !!cur.work);
      if (!cur.work) {
        view.append(h('div', { class: 'empty-view' },
          h('div', {}, state.works.length ? 'メニューから作品かサブタイトルを選んでください' : 'まずは作品を作りましょう'),
          h('button', { class: 'btn-primary', onclick: () => $('newWorkBtn').click() }, '＋ 新しい作品')
        ));
        return;
      }
      if (cur.type === 'chapter' && cur.chapter) renderEditor(view, cur.work, cur.chapter);
      else renderDetail(view, cur.work);
    }

    // --- エディタ ---
    let bodyEl = null;
    function renderEditor(view, work, ch) {
      // サブタイトルと目標文字数は作品詳細で設定する（本文画面には表示しない）
      bodyEl = h('textarea', {
        class: 'body-input', placeholder: '本文を書きましょう…\nルビ：｜漢字《かんじ》', spellcheck: false,
        oninput: () => onBodyInput(work, ch)
      });
      bodyEl.value = ch.body;
      // サブタイトルが未入力の間は本文を書けない（保存できないため）
      const lockBody = () => {
        const locked = !hasTitle(ch);
        bodyEl.disabled = locked;
        bodyEl.placeholder = locked ? '作品詳細でサブタイトルを入力すると本文を書けます' : '本文を書きましょう…\nルビ：｜漢字《かんじ》';
      };
      lockBody();
      const preview = h('div', { class: 'preview' });
      const ed = h('div', { class: 'editor' },
        state.prefs.preview ? preview : bodyEl
      );
      if (state.prefs.preview) renderPreview(preview, ch.body);
      view.append(ed);
      if (state.prefs.vertical) view.scrollLeft = view.scrollWidth;
    }
    function renderPreview(el, text) {
      el.innerHTML = text.split('\n').map((line) => `<p>${line ? renderRubyHTML(line) : '<br>'}</p>`).join('');
    }
    function onBodyInput(work, ch) {
      ch.body = bodyEl.value;
      ch._count = countText(ch.body);
      ch.updated = Date.now();
      touch(work);
      renderCounts();
      updateTreeRow(work, ch);
    }
    function updateTreeRow(work, ch) {
      const row = document.querySelector(`.ch-row[data-id="${ch.id}"]`);
      if (row) {
        const nm = row.querySelector('.ch-name');
        nm.textContent = hasTitle(ch) ? ch.title : '（サブタイトルを入力）';
        nm.classList.toggle('placeholder', !hasTitle(ch));
        const m = row.querySelector('.mini');
        m.textContent = ratio(chCount(ch), ch.goal || 0);
        m.classList.toggle('done', !!ch.goal && chCount(ch) >= ch.goal);
      }
      const wRow = row && row.closest('.work').querySelector('.work-row .mini');
      if (wRow) {
        const t = workTotals(work);
        wRow.textContent = ratio(t.count, t.goal);
        wRow.classList.toggle('done', !!t.goal && t.count >= t.goal);
      }
    }
    function deleteChapter(work, ch) {
      if (!confirm(`「${ch.title || '（未入力）'}」を削除しますか？\n本文も削除され、元に戻せません。`)) return;
      work.chapters.splice(work.chapters.indexOf(ch), 1);
      touch(work);
      if (!work.chapters.length) detailEditing = false;
      render(true);
      toast('削除しました');
    }

    // --- 挿入（……、――、ルビ） ---
    function insertText(text, selectStart, selectEnd) {
      if (!bodyEl || !document.body.contains(bodyEl)) return;
      bodyEl.focus();
      const s = bodyEl.selectionStart;
      // execCommand なら「元に戻す」が効く
      let ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch {}
      if (!ok) {
        bodyEl.setRangeText(text, bodyEl.selectionStart, bodyEl.selectionEnd, 'end');
        bodyEl.dispatchEvent(new Event('input'));
      }
      if (selectStart != null) bodyEl.setSelectionRange(s + selectStart, s + (selectEnd ?? selectStart));
    }
    function ensureEditMode() {
      if (state.prefs.preview) { state.prefs.preview = false; savePrefs(); applyPrefs(); renderView(); }
    }
    document.querySelectorAll('[data-ins]').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.preventDefault()); // キーボードを閉じない
      b.addEventListener('click', () => { ensureEditMode(); insertText(b.dataset.ins); });
    });
    $('rubyBtn').addEventListener('pointerdown', (e) => e.preventDefault());
    $('rubyBtn').addEventListener('click', () => {
      ensureEditMode();
      if (!bodyEl) return;
      const s = bodyEl.selectionStart, e = bodyEl.selectionEnd;
      const sel = bodyEl.value.slice(s, e).replace(/\n/g, '');
      openRubyDialog(sel, (base, reading) => {
        bodyEl.focus();
        bodyEl.setSelectionRange(s, e);
        insertText(`｜${base}《${reading}》`);
      });
    });
    function openRubyDialog(base, done) {
      const baseIn = h('input', { type: 'text', value: base, placeholder: '例：魔法', maxlength: '50' });
      const readIn = h('input', { type: 'text', placeholder: '例：まほう', maxlength: '50' });
      const pv = h('div', { class: 'ruby-preview' });
      const upd = () => { pv.innerHTML = baseIn.value ? `<ruby>${esc(baseIn.value)}<rt>${esc(readIn.value)}</rt></ruby>` : ''; };
      const close = () => { bg.remove(); bodyEl && bodyEl.focus(); };
      const ok = () => {
        const b = baseIn.value.replace(/[|｜《》]/g, '').trim(), r = readIn.value.replace(/[|｜《》]/g, '').trim();
        if (!b || !r) { (b ? readIn : baseIn).focus(); return; }
        bg.remove(); done(b, r);
      };
      const onKey = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ok(); } else if (e.key === 'Escape') close(); };
      baseIn.addEventListener('input', upd); readIn.addEventListener('input', upd);
      baseIn.addEventListener('keydown', onKey); readIn.addEventListener('keydown', onKey);
      const bg = h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === bg) close(); } },
        h('div', { class: 'modal', role: 'dialog', 'aria-label': 'ルビを設定' },
          h('div', { class: 'modal-body' },
            h('h3', {}, 'ルビを設定'),
            h('p', { class: 'sub' }, '親文字とふりがなを入力してください'),
            h('label', {}, '親文字'), baseIn,
            h('label', {}, 'ふりがな'), readIn,
            pv),
          h('div', { class: 'modal-btns' },
            h('button', { onclick: close }, 'キャンセル'),
            h('button', { onclick: ok }, '挿入'))
        ));
      document.body.append(bg);
      upd();
      (base ? readIn : baseIn).focus();
    }

    // --- 作品詳細 ---
    let detailEditing = false;
    function renderDetail(view, work) {
      const t = workTotals(work);
      const coverBox = h('div', { class: 'cover' + (work.cover ? ' has-img' : ''), onclick: () => $('coverFile').click(), title: '表紙画像を選択' },
        work.cover ? h('img', { src: work.cover, alt: '表紙' }) : h('span', {}, 'タップして', h('br'), '表紙画像を設定'));
      const addBtn = h('button', { class: 'group-btn', style: 'border-top:0.5px solid var(--line)', onclick: () => addChapter(work) }, '＋ サブタイトルを追加');
      const note = h('div', { class: 'section-note warn' });
      const syncTitleState = () => {
        addBtn.disabled = !hasTitle(work);
        note.textContent = hasTitle(work) ? '' : '作品名を入力すると保存されます';
      };
      const titleIn = h('input', {
        class: 'work-title-input', type: 'text', value: work.title, placeholder: '作品名（必須）', maxlength: '100',
        oninput: (e) => {
          work.title = e.target.value; touch(work); renderCrumb(); syncTitleState();
          const n = document.querySelector(`.work[data-id="${work.id}"] .work-name`);
          if (n) { n.textContent = hasTitle(work) ? work.title : '（作品名を入力）'; n.classList.toggle('placeholder', !hasTitle(work)); }
        }
      });
      const syn = h('textarea', {
        class: 'synopsis', placeholder: 'あらすじを入力…',
        oninput: (e) => { work.synopsis = e.target.value; touch(work); }
      });
      syn.value = work.synopsis || '';

      const tbody = h('tbody', {});
      work.chapters.forEach((c, i) => {
        const goalIn = h('input', {
          type: 'number', min: '0', step: '100', inputmode: 'numeric', placeholder: '0', value: c.goal ? String(c.goal) : '',
          onclick: (e) => e.stopPropagation(),
          oninput: (e) => { c.goal = Math.max(0, parseInt(e.target.value, 10) || 0); touch(work); refreshTotals(); }
        });
        const tr = h('tr', { class: detailEditing ? '' : 'link', 'data-id': c.id, onclick: () => { if (!detailEditing) navigate({ type: 'chapter', workId: work.id, chapterId: c.id }); } },
          h('td', {},
            detailEditing ? h('button', { class: 'del-btn', 'aria-label': '削除', onclick: (e) => { e.stopPropagation(); deleteChapter(work, c); } }, '−') : null,
            detailEditing
              ? h('input', {
                  class: 'ch-rename', type: 'text', value: c.title, placeholder: 'サブタイトル（必須）', maxlength: '100',
                  onclick: (e) => e.stopPropagation(),
                  oninput: (e) => { if (e.target.value.trim()) { c.title = e.target.value; touch(work); updateTreeRow(work, c); } },
                  onblur: (e) => { if (!e.target.value.trim()) e.target.value = c.title; }
                })
              : h('span', { class: hasTitle(c) ? '' : 'placeholder' }, hasTitle(c) ? c.title : '（未入力）')),
          h('td', { class: 'num' }, fmt(chCount(c))),
          h('td', {}, detailEditing
            ? h('span', { class: 'row-tools' },
                h('button', { class: 'handle', 'aria-label': 'ドラッグで並び替え', onpointerdown: (e) => startDrag(e, tr, tbody, (ids) => applyChapterOrder(work, ids)) }, '≡'))
            : goalIn));
        tbody.append(tr);
      });
      if (!work.chapters.length) tbody.append(h('tr', {}, h('td', { colspan: '3', class: 'num' }, 'サブタイトルがありません')));
      const totalCount = h('td', {}, fmt(t.count)), totalGoal = h('td', {}, fmt(t.goal));
      function refreshTotals() {
        const tt = workTotals(work);
        totalCount.textContent = fmt(tt.count); totalGoal.textContent = fmt(tt.goal);
        renderCounts(); renderTree();
      }

      const d = new Date(work.created);
      view.classList.add('grouped');
      view.append(h('div', { class: 'detail' + (detailEditing ? ' editing' : '') },
        h('div', { class: 'cover-wrap' },
          coverBox,
          work.cover ? h('div', { class: 'cover-actions' },
            h('button', { class: 'text-btn danger', onclick: () => { if (confirm('表紙画像を削除しますか？')) { work.cover = ''; touch(work); renderView(true); } } }, '表紙を削除')) : null),
        h('div', { class: 'section-label' }, '作品名'),
        h('div', { class: 'group' }, titleIn),
        note,
        h('div', { class: 'section-label' }, 'あらすじ'),
        h('div', { class: 'group' }, syn),
        h('div', { class: 'section-label with-btn' }, h('span', {}, 'サブタイトルと目標文字数'),
          work.chapters.length ? h('button', { class: 'text-btn', onclick: () => { detailEditing = !detailEditing; renderView(true); } }, detailEditing ? '完了' : '編集') : null),
        h('div', { class: 'group' },
          h('table', { class: 'goals' },
            h('thead', {}, h('tr', {}, h('th', {}, 'サブタイトル'), h('th', {}, '文字数'), h('th', {}, detailEditing ? '並び替え' : '目標'))),
            tbody,
            h('tfoot', {}, h('tr', {}, h('td', {}, '合計'), totalCount, detailEditing ? h('td', {}) : totalGoal))),
          detailEditing ? null : addBtn),
        h('div', { class: 'section-note' }, '作品の目標は、サブタイトルごとの目標の合計です。文字数はルビ記法・空白・改行を除いて数えます。'),
        work._savedTitle ? h('div', { class: 'group', style: 'margin-top:32px' },
          h('button', { class: 'group-btn danger', onclick: () => deleteWork(work) }, 'この作品を削除')) : null,
        h('div', { class: 'section-note center' }, `作成日 ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}・全${work.chapters.length}話`)
      ));
      syncTitleState();
    }
    async function deleteWork(work) {
      if (!confirm(`作品「${work.title || '無題'}」を削除しますか？\nすべてのサブタイトルと本文が削除され、元に戻せません。`)) return;
      if (prompt('確認のため「削除」と入力してください') !== '削除') return;
      state.works = state.works.filter((w) => w !== work);
      dirty.delete(work.id);
      tombs[work.id] = work._remoteVer == null ? null : work._remoteVer; saveTombs();
      pending.delete(work.id); savePending();
      try { await DB.del(work.id); } catch {}
      sync({ pull: false });
      navigate(null);
      toast('作品を削除しました');
    }

    // 表紙画像：縮小して保存
    $('coverFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      const { work } = current();
      if (!file || !work) return;
      try {
        work.cover = await resizeImage(file, 900);
        touch(work); await flush();
        renderView(true);
      } catch { toast('画像を読み込めませんでした'); }
    });
    function resizeImage(file, max) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          res(cv.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(); };
        img.src = url;
      });
    }

    // ===== 表示設定 =====
    function applyPrefs() {
      const p = state.prefs;
      document.documentElement.style.setProperty('--fs', p.fontSize + 'px');
      document.body.classList.toggle('vertical', !!p.vertical);
      document.body.classList.toggle('no-sidebar', !p.sidebar);
      $('verticalBtn').classList.toggle('on', !!p.vertical);
      $('verticalBtn').textContent = p.vertical ? '横書き' : '縦書き';
      $('previewBtn').classList.toggle('on', !!p.preview);
      document.documentElement.removeAttribute('data-theme'); // 端末のライト／ダーク設定に従う
    }
    const toggle = (key, rerender) => () => { state.prefs[key] = !state.prefs[key]; savePrefs(); applyPrefs(); if (rerender) { flush(); renderView(); } };
    $('verticalBtn').addEventListener('click', toggle('vertical', true));
    $('previewBtn').addEventListener('click', toggle('preview', true));
    $('sideToggle').addEventListener('click', toggle('sidebar'));
    $('fontUp').addEventListener('click', () => { state.prefs.fontSize = Math.min(30, state.prefs.fontSize + 1); savePrefs(); applyPrefs(); });
    $('fontDown').addEventListener('click', () => { state.prefs.fontSize = Math.max(12, state.prefs.fontSize - 1); savePrefs(); applyPrefs(); });
    $('focusBtn').addEventListener('click', () => {
      const on = document.body.classList.toggle('focus');
      $('focusBtn').classList.toggle('on', on);
      if (on) toast('集中モード（もう一度「集中」で解除）');
    });
    // ===== 表示領域への追従（iOS 対策） =====
    // 回転・キーボードの開閉・タップ後に iOS がページをずらしたままにすることがあるため、
    // アプリの枠を常に「実際に見えている領域」にぴったり合わせる
    const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'button')); };
    function fitViewport() {
      const vv = window.visualViewport;
      const app = $('app');
      if (!isTyping() && (window.scrollY || window.scrollX)) window.scrollTo(0, 0);
      const h = vv ? vv.height : window.innerHeight;
      const top = vv && isTyping() ? vv.offsetTop : 0;
      app.style.height = Math.round(h) + 'px';
      app.style.top = Math.round(top) + 'px';
    }
    function fitSoon() { [0, 100, 300, 600, 1000].forEach((t) => setTimeout(fitViewport, t)); }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
      window.visualViewport.addEventListener('scroll', fitViewport);
    }
    window.addEventListener('resize', fitSoon);
    window.addEventListener('orientationchange', fitSoon);
    window.addEventListener('pageshow', fitSoon);
    document.addEventListener('focusout', () => setTimeout(() => { if (!isTyping()) fitSoon(); }, 50));
    window.addEventListener('scroll', () => { if (!isTyping()) window.scrollTo(0, 0); }, { passive: true });
    fitViewport();
    $('menuBtn').addEventListener('click', () => document.body.classList.add('drawer'));
    $('scrim').addEventListener('click', () => document.body.classList.remove('drawer'));
    $('newWorkBtn').addEventListener('click', () => {
      state.editing = false; detailEditing = false;
      const w = createWork();
      navigate({ type: 'detail', workId: w.id }); // 新規作品は作品詳細から始める
      setTimeout(() => { const t = document.querySelector('.work-title-input'); if (t) t.focus(); }, 0);
    });
    $('editBtn').addEventListener('click', () => { state.editing = !state.editing; renderTree(); if (!state.editing) { renderCrumb(); if (current().type === 'detail') renderView(true); } });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { document.body.classList.remove('focus', 'drawer'); $('focusBtn').classList.remove('on'); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flush().then(() => sync()); }
    });

    // ===== 起動 =====
    // ===== アカウント =====
    function renderAccount() {
      $('accountEmail').textContent = (Cloud.session && Cloud.session.email) || '';
      showCloudState();
    }
    async function clearLocalData() {
      await DB.open();
      await DB.clear().catch(() => {});
      pending.clear(); savePending();
      for (const k of Object.keys(tombs)) delete tombs[k];
      saveTombs();
      ls.del('novel:works');
      state.works = [];
    }
    $('syncBtn').addEventListener('click', async () => { if (cloudState === 'notable') cloudState = 'idle'; await flush(); await sync(); if (cloudState === 'ok') toast('同期しました'); });
    $('logoutBtn').addEventListener('click', async () => {
      await flush(); await sync();
      const unsent = pending.size + Object.keys(tombs).length;
      const msg = unsent
        ? `まだクラウドに送れていない作品が${unsent}件あります。\nログアウトすると、その変更は失われます。本当にログアウトしますか？`
        : 'ログアウトしますか？\nこの端末に保存されている作品の控えは消去されます（クラウドには残ります）。';
      if (!confirm(msg)) return;
      Cloud.signOut();
      await clearLocalData();
      ls.del(OWNER_KEY);
      location.reload();
    });

    async function start() {
      started = true;
      $('app').hidden = false;
      await DB.open();
      try { state.works = (await DB.all()) || []; } catch { state.works = []; }
      state.works.forEach(markSaved);
      // 旧バージョン（単純なメモ形式）の文書を取り込む
      const legacy = ls.get('writing-app:docs:v1', null);
      if (Array.isArray(legacy) && legacy.some((d) => (d.body || d.title || '').trim()) && !ls.get('novel:migrated', false)) {
        const w = { id: uid(), title: '以前の文書', synopsis: '', cover: '', chapters: [], created: Date.now(), updated: Date.now() };
        legacy.filter((d) => (d.body || d.title || '').trim()).forEach((d) => w.chapters.push({ id: uid(), title: d.title || '無題', body: d.body || '', goal: d.goal || 0, created: d.created || Date.now(), updated: d.updated || Date.now() }));
        state.works.push(w); dirty.add(w.id);
        ls.set('novel:migrated', true);
        await flush();
      }
      if (!current().work) { const f = sortedWorks()[0]; state.prefs.view = f ? { type: 'detail', workId: f.id } : null; }
      if (state.prefs.view && state.prefs.view.type === 'chapter' && !current().chapter) state.prefs.view = { type: 'detail', workId: state.prefs.view.workId };
      render();
      renderAccount();
      sync();
    }

    if (Cloud.session) start(); else showLogin(false);
  })();
  </script>
</body>
</html>
